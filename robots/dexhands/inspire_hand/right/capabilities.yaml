schema_version: e_urdf.capabilities.v1
capabilities:
- id: open_gripper
  name: Open Gripper
  scope: manipulation
  risk: low
  sandbox_required: true
  real_robot_execution_allowed: false
- id: close_gripper_slow
  name: Close Gripper Slowly
  scope: manipulation
  risk: medium
  sandbox_required: true
  real_robot_execution_allowed: false
- id: ok_gesture_contact_aware
  name: OK Gesture with Force-Closed-Loop Control
  scope: manipulation
  risk: medium
  sandbox_required: true
  real_robot_execution_allowed: false
  required_sensors:
  - force_feedback
  notes:
  - Uses FORCE_ACT as the primary static contact signal
  - Requires calibrated open-palm baseline
  - Final OK pose must move thumb and index together from the one pose
- id: force_baseline_calibration
  name: Open-Palm Force Baseline Calibration
  scope: calibration
  risk: low
  sandbox_required: false
  real_robot_execution_allowed: false
  notes:
  - Collects FORCE_ACT offsets for all 6 DOFs in the open-palm posture
forbidden_capabilities:
- id: forceful_grasp_without_current_limit
  description: Forceful grasping without active current/torque limit
  reason: Can damage the hand and grasped object
  severity: critical
  enforcement:
    policy_block: true
    sandbox_block: true
    real_robot_block: true
- id: fast_full_close
  description: Close all fingers/joints to maximum at high speed
  reason: Risk of collision and motor overload
  severity: critical
  enforcement:
    policy_block: true
    sandbox_block: true
    real_robot_block: true
- id: static_contact_using_current_only
  description: Rely on CURRENT for static contact detection
  reason: CURRENT drops to near zero at static contact on RH56
  severity: high
  enforcement:
    policy_block: true
    sandbox_block: false
    real_robot_block: true
