  enforcement:
    policy_block: true
    sandbox_block: true
    real_robot_block: true
- id: fast_full_close
  description: Close all fingers/joints to maximum at high speed
  reason: Risk of collision and motor overload
  severity: critical
  enforcement:
    policy_block: true
    sandbox_block: true
    real_robot_block: true
